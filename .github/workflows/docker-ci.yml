name: deploy on push

on:
    push:
        branches:
            - main

permissions:
  contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        name: Start docker

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # https://github.com/marketplace/actions/docker-login
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                # Using secrets in Github Actions: https://dev.to/fuenrob/como-usar-los-secrets-de-github-3c2e
                username: ${{ secrets.DOCKER_USER }}
                password: ${{ secrets.DOCKER_PASS }}
            
            - name: Create docker file
              run: docker build -t ${{ secrets.DOCKER_USER }}/easybank:latest .

            - name: Push image to docker hub
              run: 
                docker push ${{ secrets.DOCKER_USER }}/easybank:latest