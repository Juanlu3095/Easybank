name: deploy on push

on:
    push:
        branches:
            - main

permissions:
  contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        name: Start docker

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Create docker file
              run: docker build -t ${{ secrets.DOCKER_USER }}/easybank:latest .

            - name: Push image to docker hub
              run: |
                sudo apt-get install -y socat
                echo ${{ secrets.DOCKER_PASS }} | socat EXEC:"docker attach cattainer",pty STDIN
                docker login --username ${{ secrets.DOCKER_USER }} --password-stdin
                docker push ${{ secrets.DOCKER_USER }}/easybank:latest